# DHCP and DNS of the Alnasl setup hotspot (docs/captive-portal.md); alnasl-hotspot-dns.service.
# Only on wlan0, only on the hotspot's address, and only while the hotspot is up. Every name resolves to
# the box: that is how a phone's "am I online?" check ends up at the setup page. Nothing is forwarded
# anywhere: there is no upstream server, and nothing routes from here to the hall.
port=53
interface=wlan0
bind-interfaces
listen-address=10.42.0.1
except-interface=lo
no-resolv
no-hosts
no-poll
domain-needed
address=/#/10.42.0.1
dhcp-range=10.42.0.10,10.42.0.250,255.255.255.0,15m
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# RFC 8910: where the captive portal API is (RFC 8908). Clients want it over HTTPS, so most ignore this
# one; the probes do the work. Cheap to be right for whoever does read it.
dhcp-option=114,"http://10.42.0.1/api/captive"
dhcp-authoritative
# Leases in memory only: they last as long as the hotspot does, which is not long.
leasefile-ro
pid-file=
# The names of people's phones are nobody's business, not even the journal's.
quiet-dhcp
quiet-dhcp6
quiet-ra
