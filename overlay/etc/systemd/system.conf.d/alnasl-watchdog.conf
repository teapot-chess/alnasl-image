# v6 A/B: a new slot that hangs instead of panicking must still come back round, so grub can count the
# boot and, after three, go back to the slot that worked. The Pi's own watchdog (bcm2835_wdt, loaded
# from modules-load.d) resets the board when systemd stops feeding it.
# 15 s, not more: bcm2835_wdt's hardware maximum is 15 s (a 20-bit counter at 65536 Hz). The kernel
# refuses any longer timeout (EINVAL), and then systemd does not arm the watchdog at all: the 60 s / 5 min
# of the first draft would have left a hung slot hanging. systemd feeds it every 7.5 s.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=15s
