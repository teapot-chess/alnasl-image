# v7.5: a spare box and the Litestream replica (docs/v7-plan.md section 5; Alnasl's docs/takeover.md).
# takeover.env: ALNASL_TAKEOVER_ROLE, written by alnasl-mode at every boot (spare on a box set to "spare").
# replica.env: where the replica goes and the store's key, written by alnasl-replica from the boot partition;
# root-only, read here by systemd, never by the alnasl user. Both may be missing (the "-").
[Service]
Environment=ALNASL_LITESTREAM=/usr/local/bin/litestream
EnvironmentFile=-/run/alnasl-mode/takeover.env
EnvironmentFile=-/var/lib/alnasl-setup/replica.env
