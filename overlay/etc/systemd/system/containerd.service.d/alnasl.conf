# v7.1: the first boot of a new slot (an update) reads a lot from the SD card at once: Alnasl's first start,
# the new kiosk image, the journal. containerd's stock 90 s can run out then, and docker, the kiosk image and
# the screen went down with it. Five minutes, and another try when it still fails.
[Service]
TimeoutStartSec=300
Restart=on-failure
RestartSec=10
