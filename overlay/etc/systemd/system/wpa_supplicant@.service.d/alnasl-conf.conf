[Unit]
# No Wi-Fi configured (no alnasl-wifi.txt was given): do not fail at every boot.
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-%I.conf

[Service]
# Photon's unit starts the daemon with -B (background) and no log: whatever it
# says is thrown away. -s sends its messages to the journal
# (journalctl -t wpa_supplicant, shown on the Diagnostics page). The unit is
# Type=oneshot + RemainAfterExit, so systemd keeps calling it "active" even if
# the daemon has died; the settings server checks with 'wpa_cli ping' instead.
ExecStart=
ExecStart=/usr/sbin/ip link set dev %I up
ExecStart=/usr/sbin/wpa_supplicant -c /etc/wpa_supplicant/wpa_supplicant-%I.conf -B -s -i %I
