<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alnasl setup</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* The phone's sign-in sheet: narrow, touch, no keyboard of ours. app.css is sized for a hall screen. */
  html, body { font-size: 17px; }
  .top { padding: 12px 16px; } .page { padding: 16px; }
  h1 { font-size: 26px; } h2 { font-size: 20px; }
  .card { padding: 16px; }
  .mono { font-family: "DejaVu Sans Mono", ui-monospace, monospace; word-break: break-all; }
  textarea { width: 100%; min-height: 88px; border-radius: 12px; border: 1px solid var(--line); background: #0b1015;
    color: var(--text); font: inherit; padding: 12px 16px; }
  .net { display: flex; align-items: center; gap: 12px; }
  .net .n { flex: 1; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="app"><div class="top"><div class="brand">Alnasl</div></div>
<div class="page"><h1>Alnasl setup</h1><p id="portal-loading">Loading... / Laden...</p>
<noscript><p>This page needs JavaScript. Open http://10.42.0.1/ in your browser. / Deze pagina heeft JavaScript nodig. Open http://10.42.0.1/ in je browser.</p></noscript>
<p class="dim small">If this stays here, open <a href="http://10.42.0.1/">http://10.42.0.1/</a> in your browser while on this Wi-Fi. / Blijft dit staan, open dan <a href="http://10.42.0.1/">http://10.42.0.1/</a> in je browser terwijl je op deze wifi zit.</p></div></div>
<script>
  // Before portal.js: if it dies on an old or odd browser, say so on the page instead of showing nothing.
  window.onerror = function (m, src, line) {
    var p = document.getElementById("portal-loading") || document.body.appendChild(document.createElement("p"));
    p.textContent = "Error / Fout: " + m + " (" + (line || "?") + ")";
  };
</script>
<script src="/portal.js"></script>
</body>
</html>
