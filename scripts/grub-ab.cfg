# Alnasl v6 A/B boot. This file is the boot partition's /boot/grub2/grub.cfg (assemble.sh puts it there);
# it is not part of any system slot, so an update never changes it.
#
#   card: 1 boot (FAT, this file, alnasl/grubenv) | 2 system A | 3 system B | 4 data
#
# /alnasl/grubenv (1024 bytes, on this partition, written in place by grub and by alnasl-system-update):
#   alnasl_slot          A or B: the slot that last started properly
#   alnasl_try           none, or the slot a new image was written to and is on trial
#   alnasl_tries         boots the trial has left: 3, 2, 1; at 0 grub goes back to alnasl_slot
#   alnasl_failed        none, or the slot grub gave up on (the old slot's boot check reports it)
#   alnasl_try_version   for the reports only
# grub 2.06 has no arithmetic, hence the explicit 3 -> 2 -> 1 -> 0. A boot that never reaches userspace
# (panic: panic=10 restarts; hang: the hardware watchdog does) still costs one try.
set timeout=0
set default=0
set alnasl_esp=$root
set alnasl_env=($alnasl_esp)/alnasl/grubenv
set alnasl_slot=A
set alnasl_try=none
set alnasl_tries=0
set alnasl_failed=none
if [ -f $alnasl_env ]; then
  load_env -f $alnasl_env alnasl_slot alnasl_try alnasl_tries alnasl_failed
fi

set alnasl_boot=$alnasl_slot
if [ "$alnasl_try" = "A" -o "$alnasl_try" = "B" ]; then
  if [ "$alnasl_tries" = "3" ]; then
    set alnasl_tries=2
    set alnasl_boot=$alnasl_try
  elif [ "$alnasl_tries" = "2" ]; then
    set alnasl_tries=1
    set alnasl_boot=$alnasl_try
  elif [ "$alnasl_tries" = "1" ]; then
    set alnasl_tries=0
    set alnasl_boot=$alnasl_try
  else
    set alnasl_failed=$alnasl_try
    set alnasl_try=none
    set alnasl_tries=0
  fi
  save_env -f $alnasl_env alnasl_try alnasl_tries alnasl_failed
fi
if [ "$alnasl_boot" != "B" ]; then
  set alnasl_boot=A
fi

# The disk this file was read from: the slots are its partitions 2 and 3 (labels as a fallback).
set alnasl_disk=
for d in hd0 hd1 hd2 hd3 hd4 hd5; do
  if [ "$alnasl_esp" = "$d,msdos1" ]; then
    set alnasl_disk=$d
  fi
done

function alnasl_find {
  # $1: A or B. Sets alnasl_dev to that slot's partition when it holds a system.
  set alnasl_dev=
  if [ "$1" = "B" ]; then set alnasl_n=3; set alnasl_l=ALNASL_B; else set alnasl_n=2; set alnasl_l=ALNASL_A; fi
  if [ -n "$alnasl_disk" ]; then
    if [ -f ($alnasl_disk,msdos$alnasl_n)/boot/photon.cfg ]; then
      set alnasl_dev=$alnasl_disk,msdos$alnasl_n
    fi
  fi
  if [ -z "$alnasl_dev" ]; then
    search --no-floppy --label --set=alnasl_dev $alnasl_l
  fi
}

alnasl_find $alnasl_boot
if [ -z "$alnasl_dev" ]; then
  # The chosen slot holds no system (never written, or half written): the other one.
  if [ "$alnasl_boot" = "A" ]; then set alnasl_boot=B; else set alnasl_boot=A; fi
  alnasl_find $alnasl_boot
fi
if [ "$alnasl_boot" = "B" ]; then set alnasl_part=03; else set alnasl_part=02; fi

# v7.4.2, on the linux line below and again in every slot's /boot/systemd.cfg (assemble.sh, ALNASL_BOOTFIX).
# About 1 warm reboot in 5 on a Pi 4B Rev 1.5 never came back: the kernel repeated "mmc0: Timeout waiting for
# hardware cmd interrupt" and the initrd waited for the root partition with no limit. The SD timeouts look
# like a symptom: the same boots show the VideoCore firmware mailbox timing out (raspberrypi_hwmon, -110), and
# the Pi 4's SD clock and regulators go through that firmware. The cause is not fixed here. This only stops the
# box from hanging on it:
#   rd.timeout=90           the initrd stops waiting for the root partition after 90 s (dracut's default: never)
#   rd.shell=0              and does not open its emergency shell, which waits for a keyboard nobody has
#   rd.emergency=reboot     but restarts; on a trial slot that costs one of its tries
# This file is written at the build only (an update never changes it), so a box flashed before 7.4.2 has
# the options from its slot's systemd.cfg alone.
menuentry "Alnasl" {
  load_env -f ($alnasl_dev)/boot/photon.cfg
  if [ -f ($alnasl_dev)/boot/systemd.cfg ]; then
    load_env -f ($alnasl_dev)/boot/systemd.cfg
  else
    set systemd_cmdline=net.ifnames=0
  fi
  linux ($alnasl_dev)/boot/$photon_linux root=PARTUUID=@DISKID@-$alnasl_part rootwait $photon_cmdline rw panic=10 alnasl.slot=$alnasl_boot console=ttyS0,115200n8 rd.timeout=90 rd.shell=0 rd.emergency=reboot $systemd_cmdline
  if [ -f ($alnasl_dev)/boot/$photon_initrd ]; then
    initrd ($alnasl_dev)/boot/$photon_initrd
  fi
}
